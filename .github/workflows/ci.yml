name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly trigger for the opt-in e2e-whisper job below; `test`/`resolve`
    # skip this event (see their `if:` guards) so it doesn't duplicate the
    # per-PR coverage gate.
    - cron: "0 3 * * *"
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra api

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest --cov=panoscribe --cov-report=term-missing --cov-fail-under=95

  e2e-whisper:
    # Opt-in real-Whisper e2e test (tests/test_e2e_whisper.py, @pytest.mark.slow).
    # The `test` job above is the per-PR coverage gate and is the wrong host
    # for this: it downloads a real (small) model on first run and is slow
    # relative to the mocked suite. CPU-only; runs nightly and on manual
    # dispatch, never on push/PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra api

      - name: Cache Whisper model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-tiny-model-${{ runner.os }}

      - name: Run real-Whisper e2e test
        env:
          PANO_WHISPER_MODEL: tiny
          PANO_WHISPER_DEVICE: cpu
          PANO_WHISPER_COMPUTE_TYPE: int8
        run: uv run pytest -m slow -v

  resolve:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Lock file is current
        run: uv lock --check

      - name: macOS resolves onnxruntime (CPU build)
        run: |
          uv pip compile pyproject.toml --python-platform macos --python-version 3.12 -o /tmp/macos.txt
          grep -q '^onnxruntime==' /tmp/macos.txt
          if grep -q '^onnxruntime-gpu==' /tmp/macos.txt; then
            echo "::error::macOS resolution selected onnxruntime-gpu, expected plain onnxruntime" && exit 1
          fi

      - name: Windows resolves onnxruntime-gpu (GPU build)
        run: |
          uv pip compile pyproject.toml --python-platform windows --python-version 3.11 -o /tmp/windows.txt
          grep -q '^onnxruntime-gpu==' /tmp/windows.txt
          if grep -q '^onnxruntime==' /tmp/windows.txt; then
            echo "::error::Windows resolution selected plain onnxruntime, expected onnxruntime-gpu only" && exit 1
          fi

      - name: Linux x86_64 resolves onnxruntime-gpu (GPU build)
        run: |
          uv pip compile pyproject.toml --python-platform linux --python-version 3.11 -o /tmp/linux.txt
          grep -q '^onnxruntime-gpu==' /tmp/linux.txt
          if grep -q '^onnxruntime==' /tmp/linux.txt; then
            echo "::error::Linux x86_64 resolution selected plain onnxruntime, expected onnxruntime-gpu only" && exit 1
          fi

      - name: Linux aarch64 resolves onnxruntime (CPU build)
        run: |
          uv pip compile pyproject.toml --python-platform aarch64-manylinux_2_28 --python-version 3.11 -o /tmp/aarch64.txt
          grep -q '^onnxruntime==' /tmp/aarch64.txt
          if grep -q '^onnxruntime-gpu==' /tmp/aarch64.txt; then
            echo "::error::linux-aarch64 resolution selected onnxruntime-gpu, expected plain onnxruntime" && exit 1
          fi

      - name: Python 3.13 resolves cleanly (Linux x86_64 selects onnxruntime-gpu)
        run: |
          uv pip compile pyproject.toml --python-platform linux --python-version 3.13 -o /tmp/py313.txt
          grep -q '^onnxruntime-gpu==' /tmp/py313.txt
          if grep -q '^onnxruntime==' /tmp/py313.txt; then
            echo "::error::Python 3.13 Linux x86_64 resolution selected plain onnxruntime, expected onnxruntime-gpu only" && exit 1
          fi
