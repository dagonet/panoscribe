name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target:
        description: "Package index to publish to"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  guard:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert tag matches pyproject version
        run: |
          PYPROJECT_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "tag=${GITHUB_REF_NAME} pyproject=${PYPROJECT_VERSION}"
            if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} (version ${TAG_VERSION}) does not match pyproject.toml version ${PYPROJECT_VERSION}"
              exit 1
            fi
          else
            echo "workflow_dispatch run, pyproject version=${PYPROJECT_VERSION} (no tag to compare)"
          fi

  build:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Check distributions with twine
        run: uvx twine check --strict dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: github.event_name == 'push' || github.event.inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: [build, publish-testpypi]
    # publish-testpypi is intentionally skipped on this trigger path (target=pypi
    # dispatch), and GitHub's implicit `needs` gate treats a skipped dependency as
    # blocking unless overridden with `always()`. Without it this job is
    # unreachable by any input combination.
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.target == 'pypi' &&
      needs.build.result == 'success' &&
      (needs.publish-testpypi.result == 'success' || needs.publish-testpypi.result == 'skipped')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-status:
    # Runs regardless of upstream outcome so a target=pypi dispatch that
    # publishes nothing is reported as a failed run instead of a false green
    # (see run 33114254809: all publish jobs skipped, workflow still "success").
    needs: [build, publish-testpypi, publish-pypi]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify a requested PyPI publish actually happened
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.target }}" = "pypi" ]; then
            if [ "${{ needs.publish-pypi.result }}" != "success" ]; then
              echo "::error::target=pypi was requested but publish-pypi did not succeed (result=${{ needs.publish-pypi.result }}). Nothing was published to PyPI."
              exit 1
            fi
            echo "Published to PyPI successfully."
          else
            echo "No PyPI publish requested on this trigger (event=${{ github.event_name }}, target=${{ github.event.inputs.target }})."
          fi
