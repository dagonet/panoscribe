[project]
name = "panoscribe"
version = "0.7.0"
description = "Extract complete video transcripts — speech AND on-screen text — from TikTok, YouTube, Instagram and more."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# onnxruntime-gpu has shipped cp313 win_amd64 wheels since 1.20.0 and cp314
# since 1.24.1, so nothing blocks Python 3.13 here.
requires-python = ">=3.11,<3.14"
authors = [
    { name = "dagonet" },
]
keywords = [
    "transcription",
    "speech-to-text",
    "ocr",
    "video-processing",
    "whisper",
    "rapidocr",
    "tiktok",
    "youtube",
    "instagram",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "faster-whisper>=1.1.0",
    "nvidia-cuda-runtime-cu12>=12,<13 ; sys_platform == 'win32'",
    "nvidia-cublas-cu12>=12,<13       ; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10         ; sys_platform == 'win32'",
    "nvidia-cufft-cu12>=11,<12        ; sys_platform == 'win32'",
    "rapidocr>=3.8,<4.0",
    "onnxruntime-gpu>=1.20,<2.0 ; (sys_platform == 'win32' or sys_platform == 'linux') and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
    "numpy>=1.26,<3.0",
    "yt-dlp>=2024.0",
    "typer>=0.13",
    "pydantic-settings>=2.0",
    "rapidfuzz>=3.9,<4.0",
    "rich>=13.0",
    "opencv-python-headless>=4.9,<5.0",
]

[project.optional-dependencies]
photo = [
    "gallery-dl>=1.30",
]
llm = [
    "ollama>=0.4",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",
]

[project.scripts]
panoscribe = "panoscribe.cli:app"

[project.urls]
Homepage = "https://github.com/dagonet/panoscribe"
Repository = "https://github.com/dagonet/panoscribe"
Issues = "https://github.com/dagonet/panoscribe/issues"
Changelog = "https://github.com/dagonet/panoscribe/blob/main/CHANGELOG.md"

[tool.uv]
# rapidocr hard-depends on the full opencv-python wheel, which dlopens libGL
# at import time and breaks headless Linux (GitHub runners dropped libGL from
# ubuntu-latest on 2026-07-13, turning this latent conflict into a hard CI
# failure — two wheels were installing into the same cv2/ package). This
# project ships opencv-python-headless; cv2's Python API is identical for
# rapidocr's imgproc usage. The unsatisfiable marker removes opencv-python
# from resolution entirely, leaving headless as the only cv2 provider.
# `faster-whisper` hard-requires plain `onnxruntime<2,>=1.14`. On GPU platforms
# that transitive requirement would otherwise install a second `onnxruntime`
# distribution alongside `onnxruntime-gpu` — both unpack into the same
# `onnxruntime/` package directory, so whichever installs last silently wins,
# and CUDA availability becomes a matter of install order rather than
# resolution. This override forces `onnxruntime` itself to resolve only on
# the complement of the `onnxruntime-gpu` marker above, so exactly one
# distribution is ever selected. The version bound is load-bearing: an
# unversioned override discards every constraint on the package (this
# project's, faster-whisper's, rapidocr's) globally, not just on this branch.
#
# `override-dependencies` is a uv-only mechanism — it only takes effect when
# resolving/installing via `uv`. A plain `pip install panoscribe` still pulls
# both `onnxruntime` and `onnxruntime-gpu` distributions on GPU platforms;
# that is the pre-existing status quo, not a regression introduced here.
override-dependencies = [
    "opencv-python ; sys_platform == 'never'",
    "onnxruntime>=1.20,<2.0 ; (sys_platform != 'win32' and sys_platform != 'linux') or (platform_machine != 'x86_64' and platform_machine != 'AMD64')",
]

[build-system]
# >=1.27 required: minimum version supporting PEP 639, needed to combine the
# SPDX `license` expression above with `license-files` without Warehouse
# rejecting the distribution for conflicting license metadata. The emitted
# Metadata-Version depends on the resolved hatchling version; the current
# resolution (1.32.0) emits Metadata-Version: 2.5, not 2.4.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panoscribe"]

# ── Ruff ──────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "TC001",  # annotation-only imports in tests are fine; pytest runtime needs follow
    "TC002",
    "TC003",
]
"src/panoscribe/cli.py" = [
    "B008",  # typer.Option / typer.Argument defaults are the idiomatic Typer pattern
]

[tool.ruff.lint.isort]
known-first-party = ["panoscribe"]

# ── mypy ──────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "faster_whisper.*",
    "rapidocr.*",
    "cv2.*",
    "yt_dlp.*",
    "pydub.*",
]
ignore_missing_imports = true

# ── pytest ────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers -m 'not integration and not eval and not slow'"
markers = [
    "slow: marks tests that require model inference (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require a GPU",
    "integration: requires a live local Ollama server; skipped in CI",
    "eval: requires eval fixture files (media + ground truth); skipped in CI",
]

# ── Coverage ──────────────────────────────────────────
[tool.coverage.run]
source = ["panoscribe"]

[tool.coverage.report]
fail_under = 95
